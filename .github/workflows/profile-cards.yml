name: Profile cards

# Builds the GitHub stats and streak cards shown in README.md and saves them in assets/.
# The README shows these saved files, so a slow or broken card service never puts a broken image on the profile:
# if a step fails, yesterday's card simply stays. Colours match the banner (light and dark).

on:
  schedule:
    - cron: "17 21 * * *" # every day at 02:47 in Kerala
  workflow_dispatch: # run it by hand from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/profile-cards.yml"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

env:
  STREAK_LIGHT: background=F7F5F0&border=DEDAD1&stroke=DEDAD1&ring=3B5A4F&fire=3B5A4F&currStreakNum=1F1D1A&sideNums=1F1D1A&currStreakLabel=3B5A4F&sideLabels=5C574F&dates=5C574F
  STREAK_DARK: background=171614&border=33302B&stroke=33302B&ring=A3C0B3&fire=A3C0B3&currStreakNum=ECE8E1&sideNums=ECE8E1&currStreakLabel=A3C0B3&sideLabels=A8A197&dates=A8A197
  STATS_LIGHT: bg_color=F7F5F0&title_color=1F1D1A&text_color=5C574F&icon_color=3B5A4F&border_color=DEDAD1
  STATS_DARK: bg_color=171614&title_color=ECE8E1&text_color=A8A197&icon_color=A3C0B3&border_color=33302B

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Streak: computed here by the project's official Action, no hosted service involved.
      - name: Streak card (light)
        uses: DenverCoder1/github-readme-streak-stats@125aaaf200620410446ebfa51897fca3607e04fd # v1.8.2
        continue-on-error: true
        with:
          options: user=${{ github.repository_owner }}&${{ env.STREAK_LIGHT }}&border_radius=14&disable_animations=true
          path: assets/streak-light.svg
          token: ${{ secrets.PROFILE_CARDS_TOKEN || github.token }}

      - name: Streak card (dark)
        uses: DenverCoder1/github-readme-streak-stats@125aaaf200620410446ebfa51897fca3607e04fd # v1.8.2
        continue-on-error: true
        with:
          options: user=${{ github.repository_owner }}&${{ env.STREAK_DARK }}&border_radius=14&disable_animations=true
          path: assets/streak-dark.svg
          token: ${{ secrets.PROFILE_CARDS_TOKEN || github.token }}

      # Stats: GitHub Stats Extended (the maintained successor of github-readme-stats) has no Action, so download
      # its card. A card is only replaced when the new download is a real, error-free SVG.
      - name: Stats cards
        continue-on-error: true
        run: |
          set -euo pipefail
          base="https://github-stats-extended.vercel.app/api?username=${GITHUB_REPOSITORY_OWNER}&show_icons=true&hide_rank=true&include_all_commits=true&disable_animations=true&border_radius=14&card_width=495&custom_title=GitHub%20activity"
          fetch() {
            curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 60 -o "$2.tmp" "$1"
            if grep -q '<svg' "$2.tmp" && ! grep -qi 'something went wrong' "$2.tmp"; then mv "$2.tmp" "$2"; else rm -f "$2.tmp"; exit 1; fi
          }
          fetch "$base&$STATS_LIGHT" assets/stats-light.svg
          fetch "$base&$STATS_DARK" assets/stats-dark.svg

      - name: Save the cards
        run: |
          rm -f assets/*.tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg assets/streak-*.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update profile cards"
          git push
